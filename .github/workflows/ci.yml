name: slo-lab
on: [push, pull_request]
permissions: {contents: read}
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r app/requirements.txt pytest pyyaml
      - name: promtool
        run: curl -sSL https://github.com/prometheus/prometheus/releases/download/v3.15.0/prometheus-3.15.0.linux-amd64.tar.gz | sudo tar xz --strip-components=1 -C /usr/local/bin prometheus-3.15.0.linux-amd64/promtool prometheus-3.15.0.linux-amd64/prometheus
      - run: pytest -q
      - run: docker compose config -q && docker compose build
