# GENERATED by scripts/gen_rules.py - do not edit by hand
# SLO 1: checkout availability 99.5% / 30d  -> error budget 0.005
# SLO 2: checkout latency: 99% of requests < 300ms / 30d -> budget 0.01
# Alerts: multi-window multi-burn-rate (Google SRE Workbook, 'Alerting on SLOs', recipe 6)
groups:
  - name: slo-recording
    interval: 15s
    rules:
      - record: slo:checkout_errors:ratio_rate5m
        expr: (sum(rate(http_requests_total{route="/checkout",code=~"5.."}[5m])) or vector(0)) / sum(rate(http_requests_total{route="/checkout"}[5m]))
      - record: slo:checkout_slow:ratio_rate5m
        expr: 1 - (sum(rate(http_request_duration_seconds_bucket{route="/checkout",le="0.3"}[5m])) / sum(rate(http_request_duration_seconds_count{route="/checkout"}[5m])))
      - record: slo:checkout_errors:ratio_rate30m
        expr: (sum(rate(http_requests_total{route="/checkout",code=~"5.."}[30m])) or vector(0)) / sum(rate(http_requests_total{route="/checkout"}[30m]))
      - record: slo:checkout_slow:ratio_rate30m
        expr: 1 - (sum(rate(http_request_duration_seconds_bucket{route="/checkout",le="0.3"}[30m])) / sum(rate(http_request_duration_seconds_count{route="/checkout"}[30m])))
      - record: slo:checkout_errors:ratio_rate1h
        expr: (sum(rate(http_requests_total{route="/checkout",code=~"5.."}[1h])) or vector(0)) / sum(rate(http_requests_total{route="/checkout"}[1h]))
      - record: slo:checkout_slow:ratio_rate1h
        expr: 1 - (sum(rate(http_request_duration_seconds_bucket{route="/checkout",le="0.3"}[1h])) / sum(rate(http_request_duration_seconds_count{route="/checkout"}[1h])))
      - record: slo:checkout_errors:ratio_rate2h
        expr: (sum(rate(http_requests_total{route="/checkout",code=~"5.."}[2h])) or vector(0)) / sum(rate(http_requests_total{route="/checkout"}[2h]))
      - record: slo:checkout_slow:ratio_rate2h
        expr: 1 - (sum(rate(http_request_duration_seconds_bucket{route="/checkout",le="0.3"}[2h])) / sum(rate(http_request_duration_seconds_count{route="/checkout"}[2h])))
      - record: slo:checkout_errors:ratio_rate6h
        expr: (sum(rate(http_requests_total{route="/checkout",code=~"5.."}[6h])) or vector(0)) / sum(rate(http_requests_total{route="/checkout"}[6h]))
      - record: slo:checkout_slow:ratio_rate6h
        expr: 1 - (sum(rate(http_request_duration_seconds_bucket{route="/checkout",le="0.3"}[6h])) / sum(rate(http_request_duration_seconds_count{route="/checkout"}[6h])))
      - record: slo:checkout_errors:ratio_rate1d
        expr: (sum(rate(http_requests_total{route="/checkout",code=~"5.."}[1d])) or vector(0)) / sum(rate(http_requests_total{route="/checkout"}[1d]))
      - record: slo:checkout_slow:ratio_rate1d
        expr: 1 - (sum(rate(http_request_duration_seconds_bucket{route="/checkout",le="0.3"}[1d])) / sum(rate(http_request_duration_seconds_count{route="/checkout"}[1d])))
      - record: slo:checkout_errors:ratio_rate3d
        expr: (sum(rate(http_requests_total{route="/checkout",code=~"5.."}[3d])) or vector(0)) / sum(rate(http_requests_total{route="/checkout"}[3d]))
      - record: slo:checkout_slow:ratio_rate3d
        expr: 1 - (sum(rate(http_request_duration_seconds_bucket{route="/checkout",le="0.3"}[3d])) / sum(rate(http_request_duration_seconds_count{route="/checkout"}[3d])))
  - name: slo-alerts
    interval: 15s
    rules:
      - alert: CheckoutSLOAvailabilityBurn1h
        expr: slo:checkout_errors:ratio_rate1h > 0.072 and slo:checkout_errors:ratio_rate5m > 0.072
        for: 2m
        labels: {severity: page, slo: checkout-availability, burn_rate: "14.4"}
        annotations:
          summary: "checkout availability SLO burning 14.4x budget (1h/5m windows)"
          description: "1h ratio={{ $value | humanizePercentage }} > 7.2%. At 14.4x, 2% of the 30d budget is gone in 1h."
          runbook_url: https://github.com/ansarshaikh/slo-lab/blob/main/RUNBOOK.md#availability
      - alert: CheckoutSLOAvailabilityBurn6h
        expr: slo:checkout_errors:ratio_rate6h > 0.03 and slo:checkout_errors:ratio_rate30m > 0.03
        for: 15m
        labels: {severity: page, slo: checkout-availability, burn_rate: "6"}
        annotations:
          summary: "checkout availability SLO burning 6x budget (6h/30m windows)"
          description: "6h ratio={{ $value | humanizePercentage }} > 3%. At 6x, 5% of the 30d budget is gone in 6h."
          runbook_url: https://github.com/ansarshaikh/slo-lab/blob/main/RUNBOOK.md#availability
      - alert: CheckoutSLOAvailabilityBurn1d
        expr: slo:checkout_errors:ratio_rate1d > 0.015 and slo:checkout_errors:ratio_rate2h > 0.015
        for: 1h
        labels: {severity: ticket, slo: checkout-availability, burn_rate: "3"}
        annotations:
          summary: "checkout availability SLO burning 3x budget (1d/2h windows)"
          description: "1d ratio={{ $value | humanizePercentage }} > 1.5%. At 3x, 10% of the 30d budget is gone in 1d."
          runbook_url: https://github.com/ansarshaikh/slo-lab/blob/main/RUNBOOK.md#availability
      - alert: CheckoutSLOAvailabilityBurn3d
        expr: slo:checkout_errors:ratio_rate3d > 0.005 and slo:checkout_errors:ratio_rate6h > 0.005
        for: 3h
        labels: {severity: ticket, slo: checkout-availability, burn_rate: "1"}
        annotations:
          summary: "checkout availability SLO burning 1x budget (3d/6h windows)"
          description: "3d ratio={{ $value | humanizePercentage }} > 0.5%. At 1x, 10% of the 30d budget is gone in 3d."
          runbook_url: https://github.com/ansarshaikh/slo-lab/blob/main/RUNBOOK.md#availability
      - alert: CheckoutSLOLatencyBurn1h
        expr: slo:checkout_slow:ratio_rate1h > 0.144 and slo:checkout_slow:ratio_rate5m > 0.144
        for: 2m
        labels: {severity: page, slo: checkout-latency, burn_rate: "14.4"}
        annotations:
          summary: "checkout latency SLO burning 14.4x budget (1h/5m windows)"
          description: "1h ratio={{ $value | humanizePercentage }} > 14.4%. At 14.4x, 2% of the 30d budget is gone in 1h."
          runbook_url: https://github.com/ansarshaikh/slo-lab/blob/main/RUNBOOK.md#latency
      - alert: CheckoutSLOLatencyBurn6h
        expr: slo:checkout_slow:ratio_rate6h > 0.06 and slo:checkout_slow:ratio_rate30m > 0.06
        for: 15m
        labels: {severity: page, slo: checkout-latency, burn_rate: "6"}
        annotations:
          summary: "checkout latency SLO burning 6x budget (6h/30m windows)"
          description: "6h ratio={{ $value | humanizePercentage }} > 6%. At 6x, 5% of the 30d budget is gone in 6h."
          runbook_url: https://github.com/ansarshaikh/slo-lab/blob/main/RUNBOOK.md#latency
      - alert: CheckoutSLOLatencyBurn1d
        expr: slo:checkout_slow:ratio_rate1d > 0.03 and slo:checkout_slow:ratio_rate2h > 0.03
        for: 1h
        labels: {severity: ticket, slo: checkout-latency, burn_rate: "3"}
        annotations:
          summary: "checkout latency SLO burning 3x budget (1d/2h windows)"
          description: "1d ratio={{ $value | humanizePercentage }} > 3%. At 3x, 10% of the 30d budget is gone in 1d."
          runbook_url: https://github.com/ansarshaikh/slo-lab/blob/main/RUNBOOK.md#latency
      - alert: CheckoutSLOLatencyBurn3d
        expr: slo:checkout_slow:ratio_rate3d > 0.01 and slo:checkout_slow:ratio_rate6h > 0.01
        for: 3h
        labels: {severity: ticket, slo: checkout-latency, burn_rate: "1"}
        annotations:
          summary: "checkout latency SLO burning 1x budget (3d/6h windows)"
          description: "3d ratio={{ $value | humanizePercentage }} > 1%. At 1x, 10% of the 30d budget is gone in 3d."
          runbook_url: https://github.com/ansarshaikh/slo-lab/blob/main/RUNBOOK.md#latency
